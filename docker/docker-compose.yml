version: "3.8"


services:
  mongo:
    image: mongo:4.4
    env_file: mongo.env
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - "MONGODB_INITDB_ROOT_USERNAME=MONGO_DB_ROOT_USERNAME"
      - "MONGODB_INITDB_ROOT_PASSWORD=MONGO_DB_ROOT_PASSWORD"
    volumes:
      - "/mongo-data/mongo/db"

  redis:
    image: redis:latest
    container_name: redis

  mysql:
    image: mysql:latest
    container_name: mysql
    env_file: mysql.env
    restart: always
    ports:
      - "3306:3306"
    environment:
      - "MYSQL_USER=USER"
      - "MYSQL_PASSWORD=PASSWORD"
      - "MYSQL_ROOT_PASSWORD=ROOT_PASSWORD"
      - "MYSQL_DATABASE=DATABASE"
    volumes:
      - "mysql_data:/var/lib/mysql"

 # Snippet code from https://github.com/coolacid/docker-misp
  misp:
    image: coolacid/misp-docker:core-latest
    restart: always
    env_file: 
      - misp.env
      - mysql.env
    container_name: misp
    depends_on:
      - redis
      - mysql
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "HOSTNAME=MISP_HOSTNAME"
      - "INIT=true"
      - "CRON_USER_ID=1"
      - "MYSQL_USER=USER"
      - "MYSQL_PASSWORD=PASSWORD"
      - "MYSQL_ROOT_PASSWORD=ROOT_PASSWORD"
      - "MYSQL_DATABASE=DATABASE"
    volumes:
     - "./misp-conf/var/www/MISP/app/Config/"
     - "./misp-logs/var/www/MISP/app/tmp/logs"
     - "./files/:var/www/MISP/app/files"

  misp-modules:
    image: coolacid/misp-docker:modules-latest
    container_name: misp-modules
    environment:
       - "REDIS_BACKEND=redis"
    depends_on:
      - redis
      - mysql

  elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:latest
      restart: always
      container_name: elasticsearch
      ports:
       - "9200:9200"
       - "9300:9300"
      environment: 
        - "xpack.security.enabled=false"
        - "discovery.type=single-node"
      volumes:
        - "esdata:/usr/share/elasticsearch/data"
 
  kibana:
    image: docker.elastic.co/elasticsearch/kibana:latest
    restart: always
    container_name: kibana
    env_file: elastic.env
    ports:
      - "5601:5601"
    environment:
      - "ELASTICSEARCH_URL=ELASTIC_URL"
      - "ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS}"
    depends_on:
      - elasticsearch
    
    logstash:
     image: docker.elastic.co/logstash/logstash:latest
     restart: always
     container_name: logstash
     volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - /var/log/GDPR/myapplication:/var/log/GDPR/myapplication:ro
     ports:
      - "5000:5000"
     environment:
        -LS_JAVA_OPTS: "-Xmx256m -Xms256m"
     depends_on:
      - elasticsearch


  squid:
    image: ubuntu/squid:latest
    ports:
      - "3128:3128"
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf
      - ./squid/passwords:/etc/squid/passwords
    restart: always


  celery_worker:
    build:
      context: .
    depends_on:
      - redis
      - mongo
      
  celery_beat:
    build: 
     context: .
    depends_on:
      - redis
      - mongo


volumes:
  mysql_data:
  esdata:
    driver: local

          